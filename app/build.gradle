plugins {
    id 'com.android.application'
}

// PART 8 — build-time API base. `./gradlew assembleRelease -PposApiBase=https://api.example.com`
// ख़ाली = ऐप का offline/demo मोड (runtime Settings से भी सेट हो सकता है).
def posApiBase = (project.findProperty('posApiBase') ?: '').toString().trim()
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && posApiBase && (posApiBase.contains('localhost')
        || posApiBase.contains('127.0.0.1') || posApiBase.contains('10.0.2.2'))) {
    throw new GradleException('Release build में posApiBase localhost/emulator URL नहीं हो सकता: ' + posApiBase)
}
def escapedApiBase = posApiBase.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.example.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.pos'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.4.1-part8'
        buildConfigField 'String', 'POS_API_BASE', '"' + escapedApiBase + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes, but old
    // transitive deps (e.g. coroutines 1.6.1) still pin jdk7/jdk8 1.6.0,
    // which causes duplicate classes. Force alignment to the stdlib version.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
