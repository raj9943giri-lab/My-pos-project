/* ---------- orders: new / detail / history ---------- */
/* ============================================================================
   PART 5 — असली ऑर्डर (SERVER mode)। Offline (डेव) मोड में नीचे की Part-1
   डेमो स्क्रीन बेछिन्न चलती है — pos_db. SERVER mode में स्क्रीन सच में backend
   से आती है: status client-चुना नहीं होता, सिर्फ़ action भेजते हैं (server
   transition map), हर tap पर confirm + दोहरा- tap guard, हर हालत में हिंदी
   संदेश. सूचियाँ अपनी ही दुकान की (shopId से) — दूसरी दुकान का ऑर्डर नहीं दिखता.
   ============================================================================ */
var ORD_HI = { NEW:'नया', ACCEPTED:'स्वीकार किया गया', PREPARING:'बनने में', PREPARED:'तैयार',
               TRANSIT:'रास्ते में', DELIVERED:'पूरा', REJECTED:'स्वीकार नहीं हुआ', CANCELLED:'रद्द' };
var ORD_BADGE = { NEW:'b-new', ACCEPTED:'b-prep', PREPARING:'b-prep', PREPARED:'b-done',
                  TRANSIT:'b-transit', DELIVERED:'b-done', REJECTED:'b-cancel', CANCELLED:'b-cancel' };
var SR_ORD = { busy:false, error:null, loaded:false, items:[], counts:{}, promise:null,
               q:'', date:'', tab:'ALL',
               detail:null, detailBusy:false, detailError:null, busyNow:{} };
function ordServer(){ return catServer(); }
function ordShopId(){ return DB.session.shopId || ''; }
function ordHi(s){ return ORD_HI[s] || ordHiFallback(s); }
function ordHiFallback(s){ return t(String(s || ''), String(s || '')); }
function ordBad(s){ return '<span class="badge ' + (ORD_BADGE[s] || 'b-neutral') + '">' + esc(ordHi(s)) + '</span>'; }
function ordPayHi(m){ return m === 'COD' ? 'कैश ऑन डिलीवरी' : (m === 'PON' ? 'दुकान पर भुगतान' : (m === 'UPI_QR' ? 'UPI QR' : String(m || ''))); }
function ordPstatHi(s){ return s === 'PAID' ? 'पेमेंट मिला' : (s === 'PENDING' ? 'पेमेंट बाकी' : (s === 'COD_PENDING' ? 'COD बाकी' : (s === 'FAILED' ? 'पेमेंट असफल' : String(s || '')))); }
function srvTs(x){ var t2 = new Date(x).getTime(); return isNaN(t2) ? 0 : t2; }

/** सूची सर्वर से (status/date/खोज फ़िल्टर सर्वर पर ही लागू होते हैं). */
function srvOrdersList(force){
  if (!ordServer()) return Promise.resolve(false);
  if (SR_ORD.promise) return SR_ORD.promise;
  if (SR_ORD.loaded && !force) return Promise.resolve(true);
  if (SR_ORD.error && !force) return Promise.resolve(false);
  SR_ORD.promise = true; SR_ORD.busy = true;
  return POS.orders.list(ordShopId(), {
    status: SR_ORD.tab || 'ALL',
    q: SR_ORD.q || undefined,
    date: SR_ORD.date || undefined,
    limit: 50
  }).then(function(res){
    SR_ORD.items = (res && res.items) || [];
    SR_ORD.counts = (res && res.counts) || {};
    SR_ORD.loaded = true; SR_ORD.error = null;
  }).catch(function(err){
    SR_ORD.error = err; SR_ORD.loaded = false;
  }).then(function(){
    SR_ORD.promise = null; SR_ORD.busy = false; renderApp();
  });
}

/** डिटेल + items + history सर्वर से — स्नैपशॉट के साथ (प्रोडक्ट बाद में बंद हो
 *  जाए तो भी पुराना नाम/कीमत/इकाई दिखेगा). */
function srvOrdersDetailLoad(id, force){
  if (!ordServer()) return;
  if (SR_ORD.detailBusy) return;
  if (SR_ORD.detail && String(SR_ORD.detail.order.id) === String(id) && !force) return;
  SR_ORD.detailBusy = true; SR_ORD.detailError = null;
  POS.orders.get(ordShopId(), id).then(function(res){
    SR_ORD.detail = res || null;
  }).catch(function(err){
    SR_ORD.detail = null; SR_ORD.detailError = err;
  }).then(function(){ SR_ORD.detailBusy = false; renderApp(); });
}

/** एक action — confirm के बाद ही जाता है; दोहरा tap दूसरी call नहीं भेजता. */
function srvOrdAction(id, action, okMsg, reason){
  var key = action + ':' + String(id);
  if (SR_ORD.busyNow[key]) { toast(t('काम चल रहा है — ठहरें','Working on it — hold on'), 'warn'); return; }
  SR_ORD.busyNow[key] = true;
  POS.orders.setStatus(ordShopId(), id, action, reason).then(function(res){
    delete SR_ORD.busyNow[key];
    toast(okMsg, 'ok');
    if (SR_ORD.detail && String(SR_ORD.detail.order.id) === String(id)) srvOrdersDetailLoad(id, true);
    else srvOrdersList(true);
  }).catch(function(err){
    delete SR_ORD.busyNow[key];
    toast(catErrText(err), 'err');
  });
}

/** कारण sheet (reject/cancel) — वैकल्पिक reason, 300 अक्षर तक. */
function ordReasonSheet(title, action, id, okLabel, confirmText){
  sheet(title,
    '<div class="f"><label>' + t('कारण (वैकल्पिक)','Reason (optional)') + '</label>' +
    '<textarea id="rsReason" maxlength="300" placeholder="' + t('जैसे: सामान उपलब्ध नहीं','e.g. item unavailable') + '"></textarea>' +
    '<div class="hint">' + t('ग्राहक यह कारण ऑर्डर स्थिति पेज पर देख पाएगा।','The customer sees this reason on the status page.') + '</div></div>' +
    '<button class="btn primary" id="rsGo">' + esc(okLabel) + '</button>' +
    '<div class="mini" style="text-align:center; margin-top:8px">' + esc(confirmText) + '</div>');
  $('#rsGo').addEventListener('click', function(){
    var r = ($('#rsReason') || {}).value || '';
    var b = $('#rsGo');
    closeSheet();
    srvOrdAction(id, action, t('हो गया','Done') + ': ' + ordHi(action === 'CANCEL' ? 'CANCELLED' : 'REJECTED'), (r || '').trim() || undefined);
  });
}

function ordStateHtml(){
  if (SR_ORD.busy || SR_ORD.promise) {
    return '<div class="empty">' + icon('clock') + '<div class="t">' + t('ऑर्डर ला रहे हैं…','Fetching orders…') + '</div>' +
      '<div class="s">' + t('सर्वर से।','From the server.') + '</div></div>';
  }
  if (SR_ORD.error) {
    return '<div class="empty">' + icon('warn') + '<div class="t">' + t('ऑर्डर लोड नहीं हुए','Orders did not load') + '</div>' +
      '<div class="s">' + esc(catErrText(SR_ORD.error)) + '</div>' +
      '<button class="btn soft" data-a="ord-retry" style="width:auto; margin:14px auto 0; padding:0 22px">' + icon('up') + ' ' + t('फिर कोशिश करें','Retry') + '</button></div>';
  }
  return '';
}

/** सूची row — नंबर, समय, ग्राहक, सामान, कुल, स्थिति (+अभी नया pulse). */
function ordRowHtml(o, withActions){
  var isNew = o.status === 'NEW';  var acts = withActions ?
    '<div style="display:flex; gap:8px; margin-top:10px">' +
      '<button class="btn primary sm" style="flex:1" data-a="ord-acc" data-id="' + esc(o.id) + '">' + icon('check') + ' ' + t('स्वीकार','Accept') + '</button>' +
      '<button class="btn danger sm" style="flex:1" data-a="ord-rej" data-id="' + esc(o.id) + '">' + icon('x') + ' ' + t('स्वीकार न करें','Reject') + '</button>' +
    '</div>' : '';
  var names = o.itemNames || '';
  return '<div class="card flat" style="margin-bottom:10px" data-go="orders/detail?id=' + esc(o.id) + '">' +
    '<div class="rowflex"><div style="min-width:0"><b>' + esc(o.number || ('#' + o.id)) + '</b> <span class="mini">· ' + esc(o.customerName || '') + '</span></div>' +
    '<span class="mini">' + fmtTime(srvTs(o.placedAt)) + '</span></div>' +
    '<div class="mini" style="margin:4px 0 2px">' + esc(names) + '</div>' +
    '<div class="rowflex" style="margin-top:6px"><span>' + ordBad(o.status) +
      (isNew ? ' <span class="badge b-low">●</span>' : '') +
      '</span><b class="money">' + money(o.total) + ' <span class="mini">(' + esc(ordPayHi(o.payMode)) + ')</span></b></div>' +
    acts + '</div>';
}

/* --- नए ऑर्डर स्क्रीन (SERVER) — नया पहले, प्रोसेसिंग बाद --- */
function srvOrdersNewView(){
  var stateHtml = ordStateHtml();
  var fresh = SR_ORD.items.filter(function(o){ return o.status === 'NEW'; });
  var processing = SR_ORD.items.filter(function(o){
    return ['ACCEPTED','PREPARING','PREPARED','TRANSIT'].indexOf(o.status) !== -1;
  });
  var rows = fresh.map(function(o){ return ordRowHtml(o, true); }).join('');
  var rec = processing.map(function(o){ return ordRowHtml(o, false); }).join('');
  document.getElementById('app').innerHTML =
    topbar({title: t('नए ऑर्डर','New orders'), back: true,
      right:'<button class="tact" data-a="ord-refresh" style="color:#fff">' + icon('up') + '</button>'}) +
    '<main>' +
      (stateHtml || (rows || '<div class="empty">' + icon('check') + '<div class="t">' + t('कोई नया ऑर्डर नहीं','No new orders') + '</div><div class="s">' + t('जैसे ही ग्राहक ऑर्डर देते हैं, यहाँ दिखेगा।','Customer orders will show here.') + '</div></div>')) +
      (stateHtml ? '' : (rec ? '<div class="sect" style="margin-top:14px">' + t('प्रोसेसिंग','In progress') + '</div>' + rec : '')) +
    '</main>';
}

/* --- पूरी सूची + फ़िल्टर + खोज (SERVER) --- */
function srvOrdersHomeView(){
  var stateHtml = ordStateHtml();
  var tabs = [['ALL','सभी'],['NEW','नया'],['ACCEPTED','स्वीकार'],['PREPARING','बन रहे'],['PREPARED','तैयार'],['TRANSIT','रास्ते में'],['DELIVERED','पूरे'],['REJECTED','अस्वीकृत'],['CANCELLED','रद्द']];
  var tabH = tabs.map(function(x){
    var cnt = x[0] === 'ALL' ? (SR_ORD.counts ? Object.keys(SR_ORD.counts).reduce(function(s, k){ return s + (Number(SR_ORD.counts[k]) || 0); }, 0) : 0)
                             : (Number((SR_ORD.counts || {})[x[0]]) || 0);
    return '<button class="chip' + (SR_ORD.tab === x[0] ? ' on' : '') + '" data-otab="' + x[0] + '">' + esc(x[1]) + (cnt ? ' (' + cnt + ')' : '') + '</button>';
  }).join('');
  var list = SR_ORD.items.map(function(o){ return ordRowHtml(o, o.status === 'NEW'); }).join('');
  document.getElementById('app').innerHTML =
    topbar({title: t('ऑर्डर','Orders'), back: false,
      right:'<button class="tact" data-go="orders/new" style="color:#fff">' + icon('plus') + '</button>' +
            '<button class="tact" data-a="ord-refresh" style="color:#fff">' + icon('up') + '</button>'}) +
    '<main>' +
      '<div class="pagepad" style="padding-bottom:6px"><input id="oSearch" type="text" placeholder="' +
        t('ऑर्डर नंबर या ग्राहक खोजें…','Search order no. or customer…') + '" value="' + esc(SR_ORD.q) + '" style="width:100%; min-height:50px; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-size:15px; font-family:inherit; background:var(--card)"></div>' +
      '<div class="pagepad" style="padding:0 16px 8px"><input id="oDate" type="date" value="' + esc(SR_ORD.date) + '" style="width:100%; min-height:46px; border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; font-size:14px; font-family:inherit; background:var(--card)"></div>' +
      '<div class="chips">' + tabH + '</div>' +
      (stateHtml || (list || '<div class="empty">' + icon('cart') + '<div class="t">' + t('कोई ऑर्डर नहीं','No orders') + '</div><div class="s">' + t('इस फ़िल्टर में कुछ नहीं मिला।','Nothing in this filter.') + '</div></div>')) +
    '</main>' + botnav('orders');
  var st = $('#oSearch');
  if (st){
    var stT = 0;
    st.addEventListener('input', function(){
      clearTimeout(stT);
      stT = setTimeout(function(){ SR_ORD.q = st.value.trim(); srvOrdersList(true); }, 420);
    });
  }
  var dt = $('#oDate');
  if (dt) dt.addEventListener('change', function(){ SR_ORD.date = dt.value || ''; srvOrdersList(true); });
  $$('[data-otab]').forEach(function(b){
    b.addEventListener('click', function(){ SR_ORD.tab = b.getAttribute('data-otab'); srvOrdersList(true); });
  });
}
A('ord-refresh', function(){ SR_ORD.error = null; srvOrdersList(true); });
A('ord-retry', function(){ SR_ORD.error = null; srvOrdersList(true); });

/* --- ऑर्डर डिटेल + टाइमलाइन + आगे के कदम (SERVER) --- */
function srvOrdersDetailView(id){
  if (SR_ORD.detailBusy) {
    document.getElementById('app').innerHTML =
      topbar({title: t('ऑर्डर','Order'), back: true}) + '<main>' +
      '<div class="empty">' + icon('clock') + '<div class="t">' + t('विवरण ला रहे हैं…','Fetching details…') + '</div></div></main>';
    return;
  }
  if (SR_ORD.detailError || !SR_ORD.detail) {
    var notFound = SR_ORD.detailError && Number(SR_ORD.detailError.status || 0) === 404;
    document.getElementById('app').innerHTML =
      topbar({title: t('ऑर्डर','Order'), back: true}) + '<main>' +
      '<div class="empty">' + icon('warn') + '<div class="t">' + (notFound ? t('ऑर्डर नहीं मिला','Order not found') : t('विवरण लोड नहीं हुआ','Details did not load')) + '</div>' +
      '<div class="s">' + esc(SR_ORD.detailError ? catErrText(SR_ORD.detailError) : '') + '</div>' +
      '<button class="btn soft" data-a="ord-detail-retry" data-id="' + esc(id) + '" style="width:auto; margin:14px auto 0; padding:0 22px">' + icon('up') + ' ' + t('फिर कोशिश करें','Retry') + '</button></div></main>';
    return;
  }
  var d = SR_ORD.detail, o = d.order;
  var hist = d.history || [];
  var timeline = '<div class="tl">' + hist.map(function(h, i){
    var last = i === hist.length - 1;
    var bad = h.status === 'CANCELLED' || h.status === 'REJECTED';
    var dot = bad
      ? '<div class="dot on"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg></div>'
      : '<div class="dot' + (last ? ' on ring' : (hist.length === 1 ? ' on' : ' on')) + '">' + icon('check') + '</div>';
    return '<div class="step">' + dot + '<div><div class="lb">' + esc(ordHi(h.status)) +
      (h.reason ? ' — ' + esc(h.reason) : '') + '</div><div class="dt">' + fmtTime(srvTs(h.createdAt)) + '</div></div></div>';
  }).join('') + '</div>';
  var items = (d.items || []).map(function(it){
    return '<div class="rowflex" style="padding:7px 0">' +
      '<div>' + esc(it.name) + (it.variantName ? ' <span class="mini">(' + esc(it.variantName) + ')</span>' : '') +
      ' <span class="mini">' + esc(it.unit || '') + ' ×' + it.qty + '</span></div>' +
      '<b>' + money(it.lineTotal) + '</b></div>';
  }).join('');
  var payLine = ordPayHi(o.payMode) + ' · ' + ordPstatHi(o.paymentStatus);
  var isDel = o.fulfilment === 'DELIVERY';
  // कदम — server transition map के अनुसार; TRANSIT से cancel नहीं (server नियम)
  var actions = '';
  var bA = 'data-id="' + esc(o.id) + '"';
  if (o.status === 'NEW'){
    actions = '<div style="display:flex; gap:10px"><button class="btn danger" style="flex:1" data-a="ord-rej" ' + bA + '>' + t('स्वीकार न करें','Reject') + '</button>' +
      '<button class="btn primary" style="flex:1; gap:8px" data-a="ord-acc" ' + bA + '>' + icon('check') + ' ' + t('स्वीकार','Accept') + '</button></div>';
  } else if (o.status === 'ACCEPTED'){
    actions = '<button class="btn primary" ' + bA + ' data-a="ord-preparing">' + icon('clock') + ' ' + t('तैयारी शुरू करें','Start preparing') + '</button>' +
      '<button class="btn ghost" style="margin-top:10px" ' + bA + ' data-a="ord-ready">' + icon('check') + ' ' + t('सीधे तैयार करें','Mark ready') + '</button>' +
      '<button class="btn danger" style="margin-top:10px" ' + bA + ' data-a="ord-cancel">' + t('रद्द करें','Cancel') + '</button>';
  } else if (o.status === 'PREPARING'){
    actions = '<button class="btn primary" ' + bA + ' data-a="ord-ready">' + icon('check') + ' ' + t('तैयार है','Mark ready') + '</button>' +
      '<button class="btn danger" style="margin-top:10px" ' + bA + ' data-a="ord-cancel">' + t('रद्द करें','Cancel') + '</button>';
  } else if (o.status === 'PREPARED'){
    actions = (isDel
      ? '<button class="btn primary" ' + bA + ' data-a="ord-transit">' + icon('truck') + ' ' + t('रास्ते में भेजें','Mark on the way') + '</button>'
      : '<button class="btn primary" ' + bA + ' data-a="ord-done">' + icon('ok') + ' ' + t('पिकअप पूरा — दे दिया','Pickup given') + '</button>') +
      '<button class="btn danger" style="margin-top:10px" ' + bA + ' data-a="ord-cancel">' + t('रद्द करें','Cancel') + '</button>';
  } else if (o.status === 'TRANSIT'){
    actions = '<button class="btn primary" ' + bA + ' data-a="ord-done">' + icon('ok') + ' ' + t('डिलीवर हो गया','Delivered') + '</button>';
  }
  if (o.paymentStatus === 'PENDING' && o.payMode === 'UPI_QR' && ['ACCEPTED','PREPARING','PREPARED','TRANSIT'].indexOf(o.status) !== -1){
    actions += '<button class="btn soft" style="margin-top:10px" ' + bA + ' data-a="ord-paid">' + icon('coin') + ' ' + t('UPI पेमेंट मिला — दर्ज करें','UPI payment received') + '</button>';
  }
  actions += '<button class="btn ghost" style="margin-top:10px" ' + bA + ' data-a="ord-wa-c">' + icon('wa') + ' ' + t('ग्राहक को संदेश','Message customer') + '</button>';
  document.getElementById('app').innerHTML =
    topbar({title: o.number || ('#' + o.id), back: true, right: ordBad(o.status)}) +
    '<main>' +
      timeline +
      '<div class="card"><h3>' + t('सामान','Items') + '</h3>' + items + '<div class="divl"></div>' +
        '<div class="rowflex mini"><span>' + t('उप-योग','Subtotal') + '</span><span>' + money(o.subTotal) + '</span></div>' +
        (o.discount ? '<div class="rowflex mini"><span>' + t('छूट' + (o.couponCode ? ' (' + o.couponCode + ')' : ''),'Discount') + '</span><span>− ' + money(o.discount) + '</span></div>' : '') +
        '<div class="rowflex mini"><span>' + t('डिलीवरी शुल्क','Delivery fee') + '</span><span>' + money(o.deliveryFee) + '</span></div>' +
        '<div class="rowflex" style="margin-top:6px"><span style="font-weight:700">' + t('कुल','Total') + '</span><span class="money" style="font-size:18px">' + money(o.total) + '</span></div>' +
        '<div class="mini" style="margin-top:6px">' + t('भुगतान','Payment') + ': ' + esc(payLine) + ' · ' + (isDel ? t('होम डिलीवरी','Delivery') : t('दुकान से उठाना','Pickup')) + '</div>' +
        (o.instructions ? '<div class="mini" style="margin-top:4px">' + t('निर्देश','Instructions') + ': ' + esc(o.instructions) + '</div>' : '') +
      '</div>' +
      '<div class="card"><h3>' + t('ग्राहक','Customer') + '</h3>' +
        '<div class="rowflex"><div><b>' + esc(o.customerName || '') + '</b>' +
        (isDel && o.address ? '<div class="mini">' + esc(o.address) + (o.landmark ? ' (' + esc(o.landmark) + ')' : '') + '</div>' : '') +
        (!isDel ? '<div class="mini">' + t('दुकान से उठाना — पता ज़रूरत पर यहाँ','Pickup at the shop') + '</div>' : '') + '</div>' +
        '<a class="icobtn" style="background:var(--green-50); color:var(--green-800); text-decoration:none" href="tel:' + esc(o.customerPhone || '') + '">' + icon('phone') + '</a></div>' +
      '</div>' +
      (actions ? '<div class="pagepad" style="padding-top:2px">' + actions + '</div>' : '') +
    '</main>';
}
A('ord-detail-retry', function(el){ srvOrdersDetailLoad(el.getAttribute('data-id'), true); });

V.ordersNew = function(){
  if (ordServer()) { if (!SR_ORD.loaded && !(SR_ORD.busy || SR_ORD.promise)) srvOrdersList(); return srvOrdersNewView(); }
  var fresh = DB.orders.filter(function(o){ return o.status === 'नई'; });
  var recent = DB.orders.filter(function(o){ return o.status === 'तैयार' || o.status === 'रास्ते में'; });
  function row(o, action){
    var c = orderCalc(o);
    var btns = action ?
      '<div style="display:flex; gap:8px; margin-top:10px">' +
        '<button class="btn primary sm" style="flex:1" data-a="ord-acc" data-id="' + o.id + '">' + icon('check') + ' ' + t('स्वीकार','Accept') + '</button>' +
        '<button class="btn danger sm" style="flex:1" data-a="ord-rej" data-id="' + o.id + '">' + icon('x') + ' ' + t('रद्द करें','Reject') + '</button>' +
      '</div>' : '';
    return '<div class="card flat" style="margin-bottom:10px">' +

A('shop-url', function(el){
  var link = el.getAttribute('data-link') || '';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(function(){ toast(t('लिंक कॉपी हुआ','Link copied'), 'ok'); }, function(){ legacyCopy(link); });
  } else legacyCopy(link);
  function legacyCopy(t2){
    try {
      var ta = document.createElement('textarea');
      ta.value = t2; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast(t('लिंक कॉपी हुआ','Link copied'), 'ok');
    } catch(e){ toast(t('कॉपी नहीं हुआ','Copy failed'), 'err'); }

});

/** OFFLINE डेव-मोड की हाल — साफ़-साफ़ "डेव लिंक" लेबल के साथ (झूठा लाइव-दावा नहीं). */
function shareOfflineInfo(){
  var slug = DB.session.slug || 'meri-dukan';

  var url = POS.publicUrl(slug);
  return {
    offline: true,
    shop: { name: name, slug: slug, emoji: DB.profile.emoji || '🏪',
            status: DB.session.shopStatus || 'DRAFT', published: !!DB.session.shopPublished },
    publicUrl: url,
    shareText: POS.shareTextFor(name, url),
    og: { title: name, description: DB.profile.about || t('आपकी दुकान अब ऑनलाइन।','Your shop is now online.'), image: null },
    shareable: false,

  };
}
function shareLink(){ return SHARE.info ? SHARE.info.publicUrl : POS.publicUrl(DB.session.slug || ''); }
function shareMsgText(){
  var name = SHARE.info && SHARE.info.shop ? SHARE.info.shop.name : (DB.profile.name || 'दुकान');
  return viewState.shareText || POS.shareTextFor(name, shareLink());
}
/** असली QR कैनवस में बनाओ (POSQR from qr.js). @returns boolean बना या नहीं. */
function drawQrInto(canvas, url, px, cssSize){
  if (!window.POSQR || !POSQR.draw) return false;
  try {
    POSQR.draw(canvas, url, { px: px });
    canvas.style.width = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    return true;
  } catch (e) { return false; }
}
function qrUnavailableNote(){

}

/** भेजने/शेयर करने वाला मैसेज — textarea की वर्तमान सामग्री अगर खुली हो तो उसे
    तरजीह (समय में जो दिख रहा वही जाए). URL ग़ायब है तो असली public URL जोड़ते हैं. */
function shareMsgForSend(){
  var box = $('#shMsg');
  var m = (box && box.value.trim()) || viewState.shareText || shareMsgText();
  var url = shareMsgUrlForQr();
  if (url && m.indexOf(url) === -1){
    m = m.trim() + ' ' + url;
  }
  return m.replace(/\s{2,}/g, ' ').trim();
}

/* PART 5 — सर्वर मोड: असली in-app इतिहास backend के /notifications से (उस user
   की ही दुकानों की सूची दिखती है). Push notification सिर्फ़ तब जाती है जब
   backend में FCM_SERVER_KEY (.env) सेट हो — नहीं तो भी इस सूची में हर घटना
   दिखती है ("कतार" बनाम "पहुँच गई" का फ़र्क़ साफ़ रखा गया है). */
var SR_NOT = { busy:false, error:null, loaded:false, items:[], promise:null };
function srvNotifsLoad(force){
  if (!ordServer()) return Promise.resolve(false);
  if (SR_NOT.promise) return SR_NOT.promise;
  if (SR_NOT.loaded && !force) return Promise.resolve(true);
  SR_NOT.promise = true; SR_NOT.busy = true;
  return POS.notifs.list(50).then(function(res){
    SR_NOT.items = (res && res.items) || [];
    SR_NOT.loaded = true; SR_NOT.error = null;
  }).catch(function(err){
    SR_NOT.error = err; SR_NOT.loaded = false;
  }).then(function(){ SR_NOT.promise = null; SR_NOT.busy = false; renderApp(); });
}
function srvNotifsView(){
  var stateHtml = '';
  if (SR_NOT.busy || SR_NOT.promise){
    stateHtml = '<div class="empty">' + icon('clock') + '<div class="t">' + t('लोड हो रहा है…','Loading…') + '</div></div>';
  } else if (SR_NOT.error){
    stateHtml = '<div class="empty">' + icon('warn') + '<div class="t">' + t('सूची लोड नहीं हुई','List did not load') + '</div><div class="s">' + esc(catErrText(SR_NOT.error)) + '</div>' +
      '<button class="btn soft" data-a="notifs-retry" style="width:auto; margin:14px auto 0; padding:0 22px">' + icon('up') + ' ' + t('फिर कोशिश करें','Retry') + '</button></div>';
  }
  var rows = SR_NOT.items.map(function(n){
    var unread = !n.readAt;
    return itemRow({
      thumb:'<span style="font-size:20px; position:relative">🧾' +
        (unread ? '<i style="position:absolute; top:-2px; right:-4px; width:9px; height:9px; border-radius:50%; background:var(--red)"></i>' : '') + '</span>',
      title: n.body, sub: esc(n.shopName || '') + ' · ' + fmtTime(srvTs(n.createdAt)),
      act:'notif-open', dataId: String(n.id), chev:false });
  }).join('');
  document.getElementById('app').innerHTML =
    topbar({title: t('नोटिफिकेशन','Notifications'), back: true,
      right:'<button class="tact" style="color:#fff; font-size:13px; font-weight:700" data-a="notifs-readall-srv">' + t('सब पढ़ा','Mark read') + '</button>'}) +
    '<main>' + (stateHtml || (rows || '<div class="empty">' + icon('bell') + '<div class="t">' + t('कोई नोटिफिकेशन नहीं','No notifications') + '</div><div class="s">' + t('जब कुछ होगा, यहीं दिखेगा।','New activity will appear here.') + '</div></div>')) + '</main>';
}

A('notifs-readall-srv', function(){
  // अनपढ़ items एक-एक कर पढ़ा करें (markRead per-id endpoint)
  var unread = SR_NOT.items.filter(function(n){ return !n.readAt; });
  if (!unread.length){ toast(t('सब पढ़ लिए','All read'), 'ok'); return; }
  var remaining = unread.slice();
  (function next(){
    var n = remaining.shift();
    if (!n){ srvNotifsLoad(true); toast(t('सब पढ़ लिए','All read'), 'ok'); return; }
    POS.notifs.read(n.id).catch(function(){}).then(next);
  })();
});

/* ===================== ROUTER / BOOT ===================== */
var routeMap = null; // built after V is ready
function parseRoute(){
  var h = decodeURIComponent(location.hash || '');
  h = h.replace(/^#\/?/, '');
  var q = {};
  var qi = h.indexOf('?');
  if (qi >= 0){
    var kv = h.slice(qi + 1).split('&');
    for (var i = 0; i < kv.length; i++){
      var p = kv[i].split('=');
      q[p[0]] = p[1] || '';
    }
    h = h.slice(0, qi);
  }
  var parts = h.split('/').filter(Boolean);
  return { parts: parts, q: q };
}
var AUTH_ALLOWED = ['', 'onboarding', 'login', 'otp', 'register', 'register-cats', 'shop-setup'];
function renderApp(){
  closeAllOverlays();
  var r = parseRoute();
  var key = r.parts[0] || '';
  document.getElementById('splashWeb').innerHTML = '';
  // auth gate — if no session exists yet, seed the demo session so the
  // dashboard always opens (login/register remain available via logout)
  var authed = DB.session.authDone || DB.session.ownerName;
  if (!authed && AUTH_ALLOWED.indexOf(key) === -1){
    DB.session.authDone = true;
    if (!DB.session.ownerName) DB.session.ownerName = DB.profile.owner || 'राजेश शर्मा';
    saveDB();
  }
  var mainEl = document.getElementById('app');
  var fn =
    key === '' ? V.splash :
    key === 'onboarding' ? V.onboarding :
    key === 'login' ? V.login :
    key === 'otp' ? V.otp :
    key === 'register' ? V.register :
    key === 'register-cats' ? V.registerCats :
    key === 'shop-setup' ? V.shopSetup :
    key === 'home' ? V.home :
    key === 'shop' ? V.shop :
    key === 'products' ? V.products :
    key === 'products' && r.parts[1] === 'add' ? null : null;
  // layered keys (products/add, products/edit, orders/*)
  if (key === 'products' && r.parts[1] === 'add'){ PFORM.mode = 'add'; PFORM.id = null; fn = V.productForm; }
  else if (key === 'products' && r.parts[1] === 'edit'){ PFORM.mode = 'edit'; PFORM.id = r.q.id; fn = V.productForm; }
  else if (key === 'orders' && r.parts[1] === 'new'){ fn = V.ordersNew; }
  else if (key === 'orders' && r.parts[1] === 'detail'){ fn = function(){ V.ordersDetail(r.q.id); }; }
  else if (key === 'orders'){ fn = V.orders; }
  else if (key === 'cats'){ fn = V.cats; }
  else if (key === 'stock'){ fn = V.stock; }
  else if (key === 'bulk'){ fn = V.bulk; }
  else if (key === 'customers'){ fn = V.customers; }
  else if (key === 'delivery'){ fn = V.delivery; }
  else if (key === 'share' && r.parts[1] === 'print'){ fn = V.sharePrint; }
  else if (key === 'share'){ fn = V.share; }
  else if (key === 'reports'){ fn = V.reports; }
  else if (key === 'notifs'){ fn = V.notifs; }

  if (fn && !AUTH_ALLOWED.includes(key)) window.scrollTo(0, 0);
  try {

    else { document.getElementById('app').innerHTML = topbar({title: '404', back: true}) +
      '<main><div class="empty">' + icon('info') + '<div class="t">' + t('पेज नहीं मिला','Page not found') + '</div>' +
      '<div class="s">' + '#' + (r.parts.join('/') || '') + '</div>' +
      '<button class="btn soft" style="width:auto; padding:0 22px; margin:14px auto 0" data-go="home">' + t('होम जाएं','Go home') + '</button></div></main>'; }
  } catch (err){
    if (window.console && console.error) console.error(err);
    document.getElementById('app').innerHTML = topbar({title: t('कुछ गड़बड़','Something broke'), back: true}) +
      '<main><div class="empty">' + icon('warn') + '<div class="t">' + t('स्क्रीन लोड नहीं हुआ','Screen failed to load') + '</div>' +
      '<div class="s">' + esc(String(err && err.message || err)) + '</div>' +
      '<button class="btn soft" style="width:auto; padding:0 22px; margin:14px auto 0" data-go="home">' + t('होम जाएं','Go home') + '</button></div></main>';
  }
}
A('navback', function(){ history.back(); });
window.__posHandleBack = function(){
  if ($("#sheetBack") || document.querySelector('.dlg-back')){ closeAllOverlays(); return true; }
  return false;
};
window.addEventListener('hashchange', renderApp);
renderApp();
</script>
